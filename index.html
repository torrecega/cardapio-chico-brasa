<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="theme-color" content="#0B0A09">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">

  <!-- Prévia de link (WhatsApp, Instagram, Facebook). img/og.jpg é opcional: 1200×630. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Chico Brasa &amp; Grill">
  <meta property="og:title" content="Cardápio | Chico Brasa &amp; Grill">
  <meta property="og:description" content="Sabor de verdade, no fogo certo. Churrasco na parrilla no Jardim Botânico, Brasília. Veja o cardápio com fotos.">
  <meta property="og:image" content="img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fontes: só os pesos usados, sem bloquear a primeira pintura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Anton&amp;family=Barlow+Condensed:wght@400;500;600&amp;display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Anton&amp;family=Barlow+Condensed:wght@400;500;600&amp;display=swap"></noscript>

  <link rel="stylesheet" href="css/styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Restaurant",
    "name": "Chico Brasa & Grill",
    "description": "Churrasco na parrilla no Jardim Botânico, Brasília-DF. Sabor de verdade, no fogo certo.",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Av. San Diêgo, Loja 17, Polo de Artesanato, Jardim Botânico",
      "addressLocality": "Brasília",
      "addressRegion": "DF",
      "addressCountry": "BR"
    },
    "telephone": "+55 61 98120-8224",
    "servesCuisine": ["Churrasco", "Parrilla", "Brasileira"],
    "acceptsReservations": true,
    "hasMenu": "https://chicobrasaegrill.com.br/cardapio/",
    "url": "https://chicobrasaegrill.com.br/",
    "sameAs": ["https://www.instagram.com/chicobrasagrill/"]
  }
  </script>
</head>
<body>
  <a class="pular" href="#cardapio">Pular para o cardápio</a>

  <!-- TOPO: capa, logo, nome e botões -->
  <header class="topo" id="topo">
    <div class="capa" id="capa">
      <div class="capa-brasas" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="topo-conteudo">
      <div class="logo" id="logo" hidden></div>
      <h1 class="marca">
        <span class="marca-1">Chico Brasa</span>
        <span class="marca-2">&amp; Grill</span>
      </h1>
      <p class="slogan" id="slogan">Sabor de verdade, no fogo certo.</p>
      <p class="endereco-curto">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        Jardim Botânico · Brasília
      </p>
      <!-- Os links abaixo são atualizados pelo js/app.js a partir de dados/cardapio.js -->
      <div class="acoes" id="acoes-topo">
        <a class="btn btn-brasa" data-link="whatsapp_reservas" href="https://wa.me/5561981208224?text=Ol%C3%A1!%20Vim%20pelo%20card%C3%A1pio%20digital%20e%20gostaria%20de%20fazer%20uma%20reserva." target="_blank" rel="noopener">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.8a8.5 8.5 0 0 1-12.6 7.4l-4.4 1.3 1.4-4.2a8.5 8.5 0 1 1 15.6-4.5z"/><path d="M9 8.2c.2-.3.7-.4.9 0l.9 1.8c.1.3.1.6-.1.8l-.6.7c.6 1.2 1.5 2.1 2.7 2.7l.7-.6c.2-.2.5-.2.8-.1l1.8.9c.4.2.3.7 0 .9l-.8.7c-.6.5-1.4.6-2.1.3-2.1-.9-3.8-2.6-4.7-4.7-.3-.7-.2-1.5.3-2.1z"/></svg>
          <span>Reservar pelo WhatsApp</span>
        </a>
        <div class="acoes-sec">
          <a class="btn-sec" data-link="como_chegar" href="https://www.google.com/maps/dir/?api=1&amp;destination=Chico%20Brasa%20%26%20Grill&amp;destination_place_id=ChIJK5YRGgAjWpMR01KggmyZo_Q" target="_blank" rel="noopener">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8z"/></svg>
            <span>Como chegar</span>
          </a>
          <a class="btn-sec" data-link="avaliar_google" href="https://search.google.com/local/writereview?placeid=ChIJK5YRGgAjWpMR01KggmyZo_Q" target="_blank" rel="noopener">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
            <span>Avaliar no Google</span>
          </a>
          <a class="btn-sec" data-link="instagram" href="https://www.instagram.com/chicobrasagrill/" target="_blank" rel="noopener">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>
            <span>Instagram</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- BARRA FIXA: abas + busca + chips de categorias -->
  <div class="barra" id="barra">
    <div class="barra-in">
      <div class="barra-linha" id="barra-linha">
        <div class="abas" id="abas" role="tablist" aria-label="Seções do cardápio">
          <span class="abas-indicador" aria-hidden="true"></span>
        </div>
        <button type="button" class="btn-icone btn-busca" id="abrir-busca" aria-label="Buscar no cardápio" aria-expanded="false" aria-controls="busca">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </div>
      <form class="busca" id="busca" role="search" hidden>
        <div class="busca-campo">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="busca-input" placeholder="Buscar prato, bebida ou vinho" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar no cardápio">
          <button type="button" class="busca-limpar" id="busca-limpar" aria-label="Limpar busca" hidden>
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <button type="button" class="busca-fechar" id="fechar-busca">Fechar</button>
      </form>
    </div>
    <nav class="chips" id="chips" aria-label="Categorias">
      <div class="chips-in" id="chips-in"></div>
    </nav>
  </div>

  <!-- CARDÁPIO -->
  <main class="cardapio" id="cardapio" tabindex="-1">
    <div id="painel-aba" role="tabpanel">
      <div class="stories" id="stories" aria-label="Categorias com foto"></div>
      <section class="destaques" id="destaques" aria-labelledby="destaques-titulo" hidden></section>
      <div id="secoes"></div>
    </div>
    <div class="resultados" id="resultados" hidden></div>
    <p class="sr-only" id="busca-status" role="status" aria-live="polite"></p>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <!-- Botão flutuante da lista -->
  <button type="button" class="fab" id="fab" aria-haspopup="dialog" hidden></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Painel do prato -->
  <div class="overlay" id="ov-item" hidden>
    <div class="overlay-fundo" data-fechar></div>
    <div class="sheet" id="sheet-item" role="dialog" aria-modal="true" aria-labelledby="item-titulo" tabindex="-1"></div>
  </div>

  <!-- Painel da lista do pedido -->
  <div class="overlay" id="ov-lista" hidden>
    <div class="overlay-fundo" data-fechar></div>
    <div class="sheet" id="sheet-lista" role="dialog" aria-modal="true" aria-labelledby="lista-titulo" tabindex="-1"></div>
  </div>

  <!-- Modo garçom (tela cheia, alto contraste) -->
  <div class="garcom" id="ov-garcom" role="dialog" aria-modal="true" aria-labelledby="garcom-titulo" tabindex="-1" hidden></div>

  <script src="dados/cardapio.js" defer></script>
  <script src="dados/fotos.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
